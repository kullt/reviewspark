<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewSpark Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        h1 {
            text-align: center;
            color: #111827;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .subtitle a {
            color: #3b82f6;
            text-decoration: none;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        .debug {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">R</div>
        <h1>Sign in to ReviewSpark</h1>
        <p class="subtitle">Or <a href="/signup">create a new account</a></p>
        
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    autocomplete="email"
                    required 
                    placeholder="you@example.com"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    autocomplete="current-password"
                    required 
                    placeholder="••••••••"
                >
            </div>
            
            <button type="submit" id="submitBtn">Sign in</button>
        </form>
        
        <div class="debug" id="debug">
            <strong>Debug Log:</strong><br>
            Waiting for login attempt...
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jilhqlznhnchvmmvumxd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppbGhxbHpuaG5jaHZtbXZ1bXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDQ2ODEsImV4cCI6MjA5MDg4MDY4MX0.1F8UAxddLFyKM5nd4Han8n7L11AeKdqQoINLs45TSH4';
        
        const debug = document.getElementById('debug');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const submitBtn = document.getElementById('submitBtn');
        
        function log(msg) {
            console.log('[Login]', msg);
            debug.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + msg;
        }
        
        // Initialize Supabase
        log('Initializing Supabase...');
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                flowType: 'pkce'
            }
        });
        log('Supabase client created');
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            log('=== LOGIN ATTEMPT STARTED ===');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            log(`Email: ${email}`);
            log('Calling supabase.auth.signInWithPassword...');
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) {
                    log(`Error: ${error.message}`);
                    errorDiv.textContent = error.message;
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign in';
                    return;
                }
                
                log('Login successful!');
                log(`User: ${data.user.email}`);
                log(`Session: ${data.session ? 'Active' : 'None'}`);
                
                successDiv.textContent = 'Login successful! Redirecting...';
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 500);
                
            } catch (err) {
                log(`Exception: ${err.message}`);
                errorDiv.textContent = 'An unexpected error occurred. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
        
        log('Page loaded, ready for login');
    </script>
</body>
</html>
