  </g>
  <g transform="translate(260, 480)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="white"/>
    <text x="70" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#4f46e5" text-anchor="middle">$39/mo Pro</text>
  </g>
  
  <!-- CTA hint -->
  <text x="100" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">✨ Start Free Trial → reviewspark.vercel.app</text>
  
  <!-- Branding -->
  <text x="1100" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="end">© 2026 ReviewSpark</text>
