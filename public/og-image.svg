<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Logo sparkles -->
  <g transform="translate(100, 200)">
    <rect x="0" y="0" width="60" height="60" rx="12" fill="rgba(255,255,255,0.2)"/>
    <path d="M30 10 L35 25 L50 30 L35 35 L30 50 L25 35 L10 30 L25 25 Z" fill="white"/>
  </g>
  
  <!-- Main title -->
  <text x="180" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">ReviewSpark</text>
  
  <!-- Tagline -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="rgba(255,255,255,0.95)">Turn Google Reviews into Social Posts</text>
  
  <!-- Subtitle -->
  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">AI-powered content that saves hours of writing</text>
  
  <!-- Pricing badges -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
